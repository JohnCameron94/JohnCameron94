name: Auto Version Bump

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/workflows/**'
      - 'resume-generator/package.json'
      - 'resume-generator/public/**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if should skip
        id: check
        run: |
          # Skip if last commit was from github-actions bot
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          if [[ "$LAST_AUTHOR" == "github-actions[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: Last commit was from github-actions bot"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Bump minor version
        if: steps.check.outputs.skip != 'true'
        id: version
        run: |
          cd resume-generator
          
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Bump minor version (e.g., 1.0.0 -> 1.1.0)
          npm version minor --no-git-tag-version
          
          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check.outputs.skip != 'true'
        run: |
          git add resume-generator/package.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit changes
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          
          # Pull with rebase in case remote has new changes
          git pull --rebase origin ${{ github.ref_name }}
          
          # Push changes with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push origin ${{ github.ref_name }}; then
              echo "Successfully pushed changes"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Pulling latest changes and retrying..."
                git pull --rebase origin ${{ github.ref_name }}
                sleep 2
              fi
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
